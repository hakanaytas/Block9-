  function renderRegisterScreen(isEdit){
    let genderPick = profile.gender || '';
    let html = isEdit ? backHeader('👤 Profili Düzenle') : `
      <div class="logoWrap">
        <div class="logoTitle">🧱 BLOCK 9</div>
        <div class="logoSub">Hakan Aytaş · CodeBug yapımı</div>
      </div>
    `;
    html += `
      <div class="subtitle" style="margin-top:${isEdit?0:6}px;">${isEdit?'Bilgilerini güncelle':'Dünya sıralamasına girmek için isim ve cinsiyetini seç'}</div>
      <input type="text" class="reg-input" id="regNameInput" placeholder="İsmini yaz" maxlength="16" value="${(profile.displayName||'').replace(/"/g,'&quot;')}">
      <div class="gender-row">
        <div class="gender-opt" id="genFemale" data-g="female"><span class="gico">👩</span>Kadın</div>
        <div class="gender-opt" id="genMale" data-g="male"><span class="gico">👨</span>Erkek</div>
      </div>
      <button class="big-btn" id="btnRegisterGo">${isEdit?'💾 Kaydet':'▶️ Oyuna Başla'}</button>
      ${isEdit?'':'<div class="item-desc" style="text-align:center;margin-top:10px;">İstersen daha sonra Hesabım ekranından değiştirebilirsin.</div>'}
    `;
    mainCard.innerHTML = html;
    if(isEdit) attachBack(renderAccountScreen);

    const markGender = ()=>{
      document.getElementById('genFemale').classList.toggle('selected', genderPick==='female');
      document.getElementById('genMale').classList.toggle('selected', genderPick==='male');
    };
    markGender();
    document.getElementById('genFemale').onclick = ()=>{ playSfx('ui'); genderPick='female'; markGender(); };
    document.getElementById('genMale').onclick = ()=>{ playSfx('ui'); genderPick='male'; markGender(); };

    document.getElementById('btnRegisterGo').onclick = ()=>{
      const nameVal = document.getElementById('regNameInput').value.trim();
      if(!nameVal){ showToast('✍️ Lütfen bir isim yaz'); return; }
      playSfx('ui');
      profile.displayName = nameVal.slice(0,16);
      profile.gender = genderPick || profile.gender || '';
      profile.registered = true;
      saveProfile();
      fbPushProfileNow();
      showToast(isEdit ? '✅ Profil güncellendi' : `👋 Hoş geldin, ${profile.displayName}!`);
      if(isEdit) renderAccountScreen(); else renderMenuScreen();
    };
  }

  /* -------- BLOK MODU (görsel stil seçimi) -------- */
  /* -------- HAKKINDA / INFO -------- */
  function renderInfoScreen(){
    let html = backHeader('ℹ️ Hakkında');
    html += `
      <div class="howto" style="text-align:center;">
        <div style="font-size:40px;margin-bottom:6px;">🧱</div>
        <div style="font-size:18px;font-weight:800;color:#24264a;margin-bottom:2px;">BLOCK 9</div>
        <div class="item-desc" style="margin-bottom:14px;">Sürüm 1.0</div>
        <div class="stat-line" style="border:none;flex-direction:column;gap:2px;padding:6px 0;">
          <span style="font-size:12px;color:#8d8fa3;font-weight:700;">GELİŞTİRİCİLER</span>
          <b style="font-size:14.5px;">Hakan Aytaş &amp; Şükran Aytaş</b>
        </div>
        <div class="stat-line" style="border:none;flex-direction:column;gap:2px;padding:6px 0 0;">
          <span style="font-size:12px;color:#8d8fa3;font-weight:700;">ŞİRKET</span>
          <b style="font-size:14.5px;">CodeBug Limited</b>
        </div>
        <div class="item-desc" style="margin-top:12px;">Hakan Aytaş ve Şükran Aytaş önderliğinde kurulan CodeBug Limited şirketi tarafından geliştirilmiştir.</div>
      </div>
      <div class="item-desc" style="text-align:center;">© ${new Date().getFullYear()} CodeBug Limited. Tüm hakları saklıdır.</div>
    `;
    mainCard.innerHTML = html;
    attachBack(renderSettingsScreen);
  }

  function backHeader(title){
    return `<div class="screen-header"><button class="back-btn" id="btnBack">←</button><h2>${title}</h2></div>`;
  }
  function attachBack(target){ document.getElementById('btnBack').onclick = ()=>{ playSfx('ui'); (target||renderMenuScreen)(); }; }

  /* -------- TEMALAR -------- */
  function themeLockLabel(t){
    if(t.unlockLevel!==undefined) return `Seviye ${t.unlockLevel}'de açılır`;
    if(t.unlockAch){ const a = ACHIEVEMENTS.find(x=>x.id===t.unlockAch); return a ? `"${a.name}" başarımıyla açılır` : 'Başarımla açılır'; }
    return 'Kilitli';
  }
  function renderThemesScreen(){
    let html = backHeader('🎨 Temalar');
    html += `<div class="subtitle" style="margin-bottom:12px;">Temaların kilidi coin ile değil, seviye atlayarak ve başarımlarla açılır. Coin'lerini Mağaza'daki Şans Kutusu ve takviyeler için biriktir.</div>`;
    THEMES.forEach(t=>{
      const unlocked = profile.unlockedThemes.includes(t.id);
      const selected = profile.currentTheme === t.id;
      html += `<div class="theme-item">
        <canvas class="theme-swatch" id="prevTheme_${t.id}" width="42" height="42"></canvas>
        <div class="item-info"><div class="item-name">${t.name}</div><div class="item-desc">${unlocked ? (selected?'Seçili':'Sahipsin') : themeLockLabel(t)}</div></div>
        <button class="item-btn ${selected?'selected':(unlocked?'buy':'locked')}" data-id="${t.id}" ${unlocked?'':'disabled'}>${selected?'✓':(unlocked?'Seç':'🔒')}</button>
      </div>`;
    });
    mainCard.innerHTML = html;
    attachBack(renderSettingsScreen);
    THEMES.forEach(t=>{
      renderMiniBlockPreview(document.getElementById('prevTheme_'+t.id), previewColorForTheme(t));
    });
    mainCard.querySelectorAll('[data-id]').forEach(btn=>{
      btn.onclick = ()=>{
        const t = THEMES.find(x=>x.id===btn.dataset.id);
        const unlocked = profile.unlockedThemes.includes(t.id);
        if(unlocked){
          profile.currentTheme = t.id; playSfx('ui'); saveProfile(); refreshMenuBackdrop(); renderThemesScreen();
        } else {
          showToast('🔒 ' + themeLockLabel(t));
        }
      };
    });
  }

  /* -------- MAĞAZA (coin ile ekstra kozmetik / hızlı avantajlar) -------- */
  function renderShopScreen(){
    let html = backHeader('🛒 Mağaza');
    html += `<div style="text-align:center;font-weight:800;color:#ffb400;margin-bottom:10px;">🪙 ${profile.coins}</div>`;

    html += `<div class="item-name" style="margin-bottom:8px;">🥤 Takviyeler</div>`;
    html += `<div class="subtitle" style="margin-bottom:10px;">Satın aldığın takviye bir sonraki oyunda otomatik devreye girer.</div>`;
    CONSUMABLES.forEach(cs=>{
      const armed = (profile.armedBoosts||[]).includes(cs.id);
      html += `<div class="shop-item">
        <div class="ach-ico">${cs.ico}</div>
        <div class="item-info"><div class="item-name">${cs.name}</div><div class="item-desc">${cs.desc}</div></div>
        <button class="item-btn ${armed?'selected':'buy'}" data-cid="${cs.id}">${armed?'Hazır ✓':cs.cost+' 🪙'}</button>
      </div>`;
    });

    html += `<div class="item-name" style="margin:16px 0 8px;">🏆 Kalıcı Yükseltmeler</div>`;
    html += `<div class="subtitle" style="margin-bottom:10px;">Bir kez satın alınır, tüm oyunlarda kalıcı olarak etkili olur.</div>`;
    UPGRADES.forEach(u=>{
      const owned = (profile.upgradesOwned||[]).includes(u.id);
      html += `<div class="shop-item">
        <div class="ach-ico">${u.ico}</div>
        <div class="item-info"><div class="item-name">${u.name}</div><div class="item-desc">${u.desc}</div></div>
        <button class="item-btn ${owned?'selected':'buy'}" data-uid="${u.id}" ${owned?'disabled':''}>${owned?'Alındı ✓':u.cost+' 🪙'}</button>
      </div>`;
    });

    html += `<div class="item-name" style="margin:16px 0 8px;">🎁 Şans Kutusu</div>`;
    html += `<div class="subtitle" style="margin-bottom:10px;">Coin, XP, takviye ve nadiren anında tema kilidi kazandırabilecek bir kutu aç. Temalar artık doğrudan satın alınmıyor — seviye atlayarak ve başarımlarla açılıyor.</div>`;
    html += `<div class="shop-item" id="crateItem" style="cursor:pointer;">
        <div class="ach-ico">🎁</div>
        <div class="item-info"><div class="item-name">Şans Kutusu</div><div class="item-desc">Rastgele ödül: coin, XP, takviye veya tema</div></div>
        <button class="item-btn buy gold-glow" id="crateBtn" style="box-shadow:none;">${LUCKY_CRATE.cost} 🪙</button>
      </div>`;
    mainCard.innerHTML = html;
    attachBack(renderSettingsScreen);
    mainCard.querySelectorAll('[data-cid]').forEach(btn=>{
      btn.onclick = ()=>{
        const cs = CONSUMABLES.find(x=>x.id===btn.dataset.cid);
        const armed = (profile.armedBoosts||[]).includes(cs.id);
        if(armed){ return; }
        if(profile.coins >= cs.cost){
          profile.coins -= cs.cost;
          profile.armedBoosts = profile.armedBoosts||[];
          profile.armedBoosts.push(cs.id);
          coinValueEl.textContent = profile.coins;
          playSfx('coin'); showToast(`${cs.ico} ${cs.name} bir sonraki oyun için hazır!`);
          saveProfile(); renderShopScreen();
        } else { showToast('🪙 Yetersiz coin'); }
      };
    });
    mainCard.querySelectorAll('[data-uid]').forEach(btn=>{
      btn.onclick = ()=>{
        const u = UPGRADES.find(x=>x.id===btn.dataset.uid);
        if(!u || (profile.upgradesOwned||[]).includes(u.id)) return;
        if(profile.coins >= u.cost){
          profile.coins -= u.cost;
          profile.upgradesOwned = profile.upgradesOwned||[];
          profile.upgradesOwned.push(u.id);
          coinValueEl.textContent = profile.coins;
          playSfx('coin'); showToast(`${u.ico} ${u.name} kalıcı olarak açıldı!`);
          saveProfile(); renderShopScreen();
        } else { showToast('🪙 Yetersiz coin'); }
      };
    });
    const crateBtn = document.getElementById('crateBtn');
    crateBtn.onclick = ()=>{
      if(profile.coins < LUCKY_CRATE.cost){ showToast('🪙 Yetersiz coin'); return; }
      playSfx('coin');
      const resultText = openLuckyCrate();
      coinValueEl.textContent = profile.coins;
      if(resultText){ showToast(resultText); playSfx('achievement'); vibrate(20); checkAchievements(); }
      renderShopScreen();
    };
  }

  /* -------- BAŞARIMLAR -------- */
  function renderAchievementsScreen(){
    let html = backHeader('🏅 Başarımlar');
    ACHIEVEMENTS.forEach(a=>{
      const unlocked = profile.achievementsUnlocked.includes(a.id);
      const val = statValueFor(a.key);
      const pct = Math.min(100, Math.round((val/a.target)*100));
      html += `<div class="ach-item ${unlocked?'':'locked'}">
        <div class="ach-ico">${a.ico}</div>
        <div class="item-info">
          <div class="item-name">${a.name}</div>
          <div class="item-desc">${a.desc}</div>
          ${!unlocked ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
        </div>
      </div>`;
    });
    mainCard.innerHTML = html;
    attachBack(renderSettingsScreen);
  }

  /* -------- AYARLAR -------- */
  function renderSettingsScreen(){
    const s = profile.settings;
    let html = backHeader('⚙️ Ayarlar');
    html += `
      <div class="settings-row"><div class="settings-label">🔊 Ses Efektleri</div><div class="switch ${s.sound?'on':''}" id="swSound"></div></div>
      <div class="settings-row"><div class="settings-label">🎵 Müzik</div><div class="switch ${s.music?'on':''}" id="swMusic"></div></div>
      <div class="settings-row"><div class="settings-label">📳 Titreşim</div><div class="switch ${s.vibration?'on':''}" id="swVib"></div></div>
      <div class="settings-row"><div class="settings-label">📟 FPS Göster</div><div class="switch ${s.showFps?'on':''}" id="swFps"></div></div>
      <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:8px;">
        <div class="settings-label">🖼️ Grafik Kalitesi</div>
        <div class="quality-btns">
          ${['low','medium','high','ultra'].map(q=>`<button data-q="${q}" class="${s.quality===q?'active':''}">${q==='low'?'Düşük':q==='medium'?'Orta':q==='high'?'Yüksek':'Ultra'}</button>`).join('')}
        </div>
      </div>
      <div class="subtitle" style="margin-top:16px;text-align:left;">Diğer</div>
      <div class="mini-grid">
        <button class="mini-tile" id="tileShop"><span class="ico">🛒</span><span class="lbl">Mağaza</span></button>
        <button class="mini-tile" id="tileThemes"><span class="ico">🎨</span><span class="lbl">Temalar</span></button>
        <button class="mini-tile" id="tileAch"><span class="ico">🏅</span><span class="lbl">Başarımlar</span></button>
        <button class="mini-tile" id="tileStats"><span class="ico">📊</span><span class="lbl">İstatistik</span></button>
        <button class="mini-tile" id="tileDaily"><span class="ico">🎁</span><span class="lbl">Günlük Görev</span></button>
        <button class="mini-tile" id="tileInfo"><span class="ico">ℹ️</span><span class="lbl">Hakkında</span></button>
      </div>
    `;
    mainCard.innerHTML = html;
    attachBack();
    document.getElementById('swSound').onclick = ()=>{ s.sound=!s.sound; soundBtn.textContent=s.sound?'🔊':'🔇'; saveProfile(); renderSettingsScreen(); };
    document.getElementById('swMusic').onclick = ()=>{ s.music=!s.music; saveProfile(); renderSettingsScreen(); };
    document.getElementById('swVib').onclick = ()=>{ s.vibration=!s.vibration; saveProfile(); renderSettingsScreen(); };
    document.getElementById('swFps').onclick = ()=>{ s.showFps=!s.showFps; fpsEl.classList.toggle('hidden', !s.showFps); saveProfile(); renderSettingsScreen(); };
    mainCard.querySelectorAll('[data-q]').forEach(btn=>{
      btn.onclick = ()=>{ s.quality = btn.dataset.q; ensureWeatherParticles(); saveProfile(); renderSettingsScreen(); };
    });
    document.getElementById('tileShop').onclick = ()=>{ playSfx('ui'); renderShopScreen(); };
    document.getElementById('tileThemes').onclick = ()=>{ playSfx('ui'); renderThemesScreen(); };
    document.getElementById('tileAch').onclick = ()=>{ playSfx('ui'); renderAchievementsScreen(); };
    document.getElementById('tileStats').onclick = ()=>{ playSfx('ui'); renderStatsScreen(); };
    document.getElementById('tileDaily').onclick = ()=>{ playSfx('ui'); renderDailyScreen(); };
    document.getElementById('tileInfo').onclick = ()=>{ playSfx('ui'); renderInfoScreen(); };
  }

  /* -------- İSTATİSTİKLER -------- */
  function renderStatsScreen(){
    const st = profile.stats;
    const perfectRatio = st.totalBlocks>0 ? Math.round((st.totalPerfects/st.totalBlocks)*100) : 0;
    let html = backHeader('📊 İstatistikler');
    html += `
      <div class="stat-line"><span>Toplam Oyun</span><b>${st.totalGames}</b></div>
      <div class="stat-line"><span>Toplam Blok</span><b>${st.totalBlocks}</b></div>
      <div class="stat-line"><span>Toplam Perfect</span><b>${st.totalPerfects}</b></div>
      <div class="stat-line"><span>Perfect Oranı</span><b>%${perfectRatio}</b></div>
      <div class="stat-line"><span>En Yüksek Combo</span><b>${st.maxCombo}</b></div>
      <div class="stat-line"><span>En İyi Skor</span><b>${profile.bestScore}</b></div>
      <div class="stat-line"><span>Toplam Skor</span><b>${st.totalScore}</b></div>
      <div class="stat-line"><span>Toplam Coin</span><b>${st.totalCoinsEarned}</b></div>
      <div class="stat-line"><span>Toplam Süre</span><b>${formatTime(st.totalTimePlayed)}</b></div>
      <div class="stat-line"><span>Seviye</span><b>${profile.level}</b></div>
      <div class="stat-line"><span>Ünvan</span><b>${statusForLevel(profile.level).ico} ${statusForLevel(profile.level).name}</b></div>
    `;
    mainCard.innerHTML = html;
    attachBack(renderSettingsScreen);
  }
  function formatTime(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return m>0 ? `${m}dk ${s}sn` : `${s}sn`;
  }

  /* -------- GÜNLÜK GÖREVLER -------- */
  function renderDailyScreen(){
    refreshDailyQuests();
    let html = backHeader('🎁 Günlük Görevler');
    (profile.daily.quests||[]).forEach(q=>{
      const val = profile.daily.progress[q.key]||0;
      const done = val >= q.target;
      const claimed = profile.daily.claimed.includes(q.id);
      const pct = Math.min(100, Math.round((val/q.target)*100));
      html += `<div class="quest-item">
        <div class="ach-ico">${claimed?'✅':'🎯'}</div>
        <div class="item-info">
          <div class="item-name">${q.desc}</div>
          <div class="item-desc">${Math.min(val,q.target)}/${q.target} · Ödül: ${q.reward} 🪙</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        ${done && !claimed ? `<button class="item-btn buy" data-id="${q.id}">Al</button>` : ''}
      </div>`;
    });
    mainCard.innerHTML = html;
    attachBack(renderSettingsScreen);
    mainCard.querySelectorAll('[data-id]').forEach(btn=>{
      btn.onclick = ()=>{
        const q = profile.daily.quests.find(x=>x.id===btn.dataset.id);
        if(q) claimQuestIfDone(q);
        renderDailyScreen();
      };
    });
  }

  /* -------- YEREL SKOR TABLOSU -------- */
  function addToLeaderboard(finalScore){
    profile.leaderboard.push({ score: finalScore, date: todayStr() });
    profile.leaderboard.sort((a,b)=>b.score-a.score);
    profile.leaderboard = profile.leaderboard.slice(0,10);
  }
  function renderLeaderboardScreen(){
    let html = backHeader('📜 Yerel Skor Tablosu');
    html += `<div class="subtitle">Bu tablo yalnızca bu cihazda saklanır (internet gerektiren küresel skor tablosu bu offline oyunda desteklenmiyor).</div>`;
    if(profile.leaderboard.length===0){
      html += `<div class="subtitle">Henüz kayıt yok. Bir oyun bitir!</div>`;
    } else {
      profile.leaderboard.forEach((r,i)=>{
        html += `<div class="stat-line"><span>#${i+1} · ${r.date}</span><b>${r.score}</b></div>`;
      });
    }
    mainCard.innerHTML = html;
    attachBack();
  }

  /* -------- OYUN SONU -------- */
  function renderGameOverScreen(){
    addToLeaderboard(score);
    saveProfile();
    const isNewBest = score >= profile.bestScore && score>0;
    const avgAlign = alignmentCount>0 ? Math.round(alignmentSum/alignmentCount) : 0;
    const timePlayed = Math.round((performance.now()-runStartTime)/1000);

    mainCard.innerHTML = `
      ${isNewBest ? '<div class="new-best-tag">🎉 YENİ REKOR!</div>' : ''}
      <div class="result-label">KULEN YIKILDI</div>
      <div class="result-score">${score}</div>
      <div class="subtitle" style="margin-top:2px;">🏆 En İyi: ${profile.bestScore}</div>
      <div class="stat-line"><span>Perfect Sayısı</span><b>${perfectsThisRun}</b></div>
      <div class="stat-line"><span>En Büyük Combo</span><b>${maxComboThisRun}</b></div>
      <div class="stat-line"><span>Ortalama Hizalama</span><b>%${avgAlign}</b></div>
      <div class="stat-line"><span>Kazanılan Coin</span><b>🪙 ${profile.coins}</b></div>
      <div class="stat-line"><span>Seviye</span><b>${profile.level}</b></div>
      <div class="stat-line"><span>Ünvan</span><b>${statusForLevel(profile.level).ico} ${statusForLevel(profile.level).name}</b></div>
      <div class="stat-line"><span>Süre</span><b>${formatTime(timePlayed)}</b></div>
      <button class="big-btn" id="btnRestart" style="margin-top:16px;">🔄 TEKRAR OYNA</button>
      <button class="big-btn secondary" id="btnShare">📤 Paylaş</button>
      <button class="big-btn secondary" id="btnMenu">🏠 Ana Menü</button>
    `;
    document.getElementById('btnRestart').onclick = ()=>{ playSfx('ui'); startGame(); };
    document.getElementById('btnMenu').onclick = ()=>{ playSfx('ui'); state='menu'; renderMenuScreen(); };
    document.getElementById('btnShare').onclick = ()=>{
      const text = `Block 9'da ${score} skor yaptım! 🧱`;
      if(navigator.share){ navigator.share({text}).catch(()=>{}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>showToast('📋 Panoya kopyalandı')); }
      else { showToast(text); }
    };
  }

  /* =========================================================
     BAŞLANGIÇ
  ========================================================= */
  pickRandomBgAndWeather();
  refreshMenuBackdrop();
  if(profile.registered){ renderMenuScreen(); } else { renderRegisterScreen(false); }
  openOverlay();
  scheduleMusic();
  initFirebaseBridge();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
